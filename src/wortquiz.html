<title>Lexikon Duell</title>
<style>
  :root {
    --ink:        #0D131C;
    --raised:     #151E2B;
    --raised-hi:  #1C2739;
    --paper:      #E8E2D4;
    --muted:      #7D8A9E;
    --hairline:   #26313F;
    --gold:       #D4A24C;
    --gold-dim:   #8A6C33;
    --green:      #6FAE7E;
    --green-bg:   #16281D;
    --rose:       #C96A72;
    --rose-bg:    #2A171A;

    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    max-width: 440px;
    margin: 0 auto;
    padding: 28px 18px 72px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ---------- Kopf ---------- */

  .masthead {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: center;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
  }

  h1 {
    font-family: var(--serif);
    font-size: 34px;
    font-weight: normal;
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }

  .rule {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim) 20%, var(--gold-dim) 80%, transparent);
  }

  .tally {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .tally b {
    color: var(--paper);
    font-weight: normal;
  }

  /* ---------- Steuerung ---------- */

  .controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  button {
    font-family: var(--sans);
    font-size: 15px;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    cursor: pointer;
    background: var(--raised);
    color: var(--paper);
    padding: 13px 12px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  button:hover { background: var(--raised-hi); }

  button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .primary {
    flex: 1;
    background: var(--gold);
    border-color: var(--gold);
    color: #21180A;
    font-weight: 600;
  }

  .primary:hover { background: #E3B25C; }

  .ghost {
    flex: 1;
    font-size: 14px;
  }

  .mini {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    padding: 6px;
    align-self: center;
  }

  .mini:hover { color: var(--paper); background: none; }

  /* ---------- Fragen ---------- */

  .deck {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--raised);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 18px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .prompt {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .index {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }

  .word {
    font-family: var(--serif);
    font-size: 30px;
    line-height: 1.15;
    text-wrap: balance;
  }

  .stem {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 13px 14px;
    font-size: 16px;
    line-height: 1.35;
    background: var(--ink);
    border: 1px solid var(--hairline);
    border-radius: 10px;
  }

  .option .glyph {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    flex: none;
  }

  .option .label { flex: 1; }

  .option .verdict {
    font-family: var(--mono);
    font-size: 14px;
    flex: none;
    opacity: 0;
  }

  .card.done .option { cursor: default; pointer-events: none; }

  .option.right {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green);
  }

  .option.right .glyph,
  .option.right .verdict { color: var(--green); opacity: 1; }

  .option.miss {
    background: var(--rose-bg);
    border-color: var(--rose);
    color: var(--rose);
  }

  .option.miss .glyph,
  .option.miss .verdict { color: var(--rose); opacity: 1; }

  .card.done .option:not(.right):not(.miss) { opacity: 0.42; }

  /* ---------- Leerzustand ---------- */

  .blank {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    padding: 40px 10px;
    border: 1px dashed var(--hairline);
    border-radius: 14px;
  }

  .score {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="shell">
  <header class="masthead">
    <div class="eyebrow" id="eyebrow">Wortschatz</div>
    <h1 id="title">Wort Test</h1>
    <div class="rule"></div>

  </header>

  <div class="controls">

  </div>

  <main class="deck" id="deck"></main>

</div>

const PER_ROUND = 7;
const KEY = "lexikonduell.gefragt.v1";

let round = [];
let mode = "idle";
let answered = 0;
let hits = 0;

/* ---------- Gedächtnis ---------- */

function loadSeen() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    return Array.isArray(raw) ? raw : [];
  } catch (err) {
    return [];
  }
}

function saveSeen(list) {
  try {
    localStorage.setItem(KEY, JSON.stringify(list));
  } catch (err) {
    /* Privater Modus o. ä. — die Runde läuft, nur ohne Gedächtnis. */
  }
}

/* ---------- Mischen ---------- */

function shuffle(input) {
  const arr = input.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* Verteilt die Position der richtigen Antwort so, dass bei >= 3 Fragen
   jeder der drei Plätze mindestens einmal vorkommt, und bricht direkte
   Wiederholungen auf, damit kein sichtbares Muster entsteht. */
function slotPlan(count) {
  const base = Math.floor(count / 3);
  const counts = [base, base, base];
  const order = shuffle([0, 1, 2]);
  for (let i = 0; i < count - base * 3; i++) counts[order[i]]++;

  let plan = [];
  counts.forEach((n, slot) => {
    for (let k = 0; k < n; k++) plan.push(slot);
  });
  plan = shuffle(plan);

  for (let i = 1; i < plan.length; i++) {
    if (plan[i] !== plan[i - 1]) continue;
    for (let j = i + 1; j < plan.length; j++) {
      if (plan[j] !== plan[i] && plan[j] !== plan[i - 1]) {
        [plan[i], plan[j]] = [plan[j], plan[i]];
        break;
      }
    }
  }
  return plan;
}

function makeQuestion(entry, slot) {
  const [word, right, ...wrong] = entry;
  const distractors = shuffle(wrong);
  const options = [];
  let d = 0;
  for (let i = 0; i < 3; i++) {
    options.push(i === slot ? { text: right, right: true } : { text: distractors[d++], right: false });
  }
  return { word, options };
}

function buildRound(entries) {
  const plan = slotPlan(entries.length);
  return entries.map((entry, i) => makeQuestion(entry, plan[i]));
}

/* ---------- Runden starten ---------- */

function startFresh() {
  const seen = loadSeen();
  const pool = BANK.filter(e => !seen.includes(e[0]));

  if (!pool.length) {
    mode = "exhausted";
    round = [];
    render();
    return;
  }

  const picked = shuffle(pool).slice(0, Math.min(PER_ROUND, pool.length));
  round = buildRound(picked);
  mode = "fresh";
  answered = 0;
  hits = 0;
  saveSeen(seen.concat(picked.map(e => e[0])));
  render();
}

function startRepeat() {
  const seen = loadSeen();
  const pool = BANK.filter(e => seen.includes(e[0]));

  if (!pool.length) {
    mode = "nothing-seen";
    round = [];
    render();
    return;
  }

  round = buildRound(shuffle(pool).slice(0, Math.min(PER_ROUND, pool.length)));
  mode = "repeat";
  answered = 0;
  hits = 0;
  render();
}

function resetMemory() {
  saveSeen([]);
  round = [];
  mode = "idle";
  answered = 0;
  hits = 0;
  render();
}

  eyebrow: document.getElementById("eyebrow"),
  title: document.getElementById("title"),
  tally: document.getElementById("tally"),
  deck: document.getElementById("deck"),
  score: document.getElementById("score"),
  reveal: document.getElementById("btnReveal")
};

const BLANKS = {
  idle: "Tippe auf <b>Neuer Test</b> für sieben Wörter, die du hier noch nie gesehen hast.",
  exhausted: "Du hast alle Wörter im Lexikon durch. Starte den <b>Wiederholungstest</b> — oder setze das Gedächtnis zurück.",
  "nothing-seen": "Noch kein Wort gespielt. Erst einen <b>Neuen Test</b> machen, danach gibt es hier etwas zu wiederholen."
};

function render() {
  const seen = loadSeen();
  const repeat = mode === "repeat";

  els.eyebrow.textContent = repeat ? "Zweite Runde" : "Wortschatz";
  els.title.textContent = repeat ? "Wiederholungstest" : "Wort Test";
  els.tally.innerHTML = "<b>" + seen.length + "</b> / " + BANK.length + " Wörter gespielt · <b>" +
    (BANK.length - seen.length) + "</b> noch frisch";

  els.deck.replaceChildren();
  els.score.textContent = "";

  if (!round.length) {
    const blank = document.createElement("div");
    blank.className = "blank";
    blank.innerHTML = BLANKS[mode] || BLANKS.idle;
    els.deck.append(blank);
    els.reveal.hidden = true;
    return;
  }

  els.reveal.hidden = false;

  round.forEach((question, qi) => {
    const card = document.createElement("section");
    card.className = "card";

    const prompt = document.createElement("div");
    prompt.className = "prompt";

    const index = document.createElement("div");
    index.className = "index";
    index.textContent = String(qi + 1).padStart(2, "0") + " / " + String(round.length).padStart(2, "0");

    const word = document.createElement("div");
    word.className = "word";
    word.textContent = "„" + question.word + "“";

    const stem = document.createElement("div");
    stem.className = "stem";
    stem.textContent = "Was bedeutet das?";

    prompt.append(index, word, stem);

    const options = document.createElement("div");
    options.className = "options";

    question.options.forEach((option, oi) => {
      const button = document.createElement("button");
      button.className = "option";
      button.type = "button";

      const glyph = document.createElement("span");
      glyph.className = "glyph";
      glyph.textContent = "ABC"[oi];

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = option.text;

      const verdict = document.createElement("span");
      verdict.className = "verdict";
      verdict.textContent = option.right ? "✓" : "✗";

      button.append(glyph, label, verdict);
      button.addEventListener("click", () => choose(card, button, option.right));
      options.append(button);
    });

    card.append(prompt, options);
    els.deck.append(card);
  });
}

function settle(card, chosen) {
  card.classList.add("done");
  card.querySelectorAll(".option").forEach(button => {
    const isRight = button.querySelector(".verdict").textContent === "✓";
    if (isRight) button.classList.add("right");
    else if (button === chosen) button.classList.add("miss");
  });
}

function choose(card, button, isRight) {
  if (card.classList.contains("done")) return;
  settle(card, button);
  answered++;
  if (isRight) hits++;
  els.score.textContent = hits + " von " + answered + " richtig";
}

function revealAll() {
  els.deck.querySelectorAll(".card").forEach(card => settle(card, null));
  els.score.textContent = answered ? hits + " von " + answered + " richtig" : "Alles aufgedeckt";
}

document.getElementById("btnNew").addEventListener("click", startFresh);
document.getElementById("btnRepeat").addEventListener("click", startRepeat);
document.getElementById("btnReveal").addEventListener("click", revealAll);
document.getElementById("btnReset").addEventListener("click", resetMemory);

render();
</script>
